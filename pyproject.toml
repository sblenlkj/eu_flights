[project]
name = "eu-flights"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "adjusttext>=1.3.0",
    "country-converter>=1.3.2",
    "dotenv>=0.9.9",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pycountry>=26.2.16",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["graph_creation"]
